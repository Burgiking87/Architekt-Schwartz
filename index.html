<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Architekt Schwartz — Architekturbüro in Wien für Privat-, Gewerbe- und Wohnbauten. Projekte, Team und Leistungen entdecken." />
  <title>Architekt Schwartz — Architekturbüro</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    /* Neue Ebene fährt von unten herein (siehe js/transitions.js).
       Sicherheitsnetz, falls das Skript nicht geladen wird. */
    (function () {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('stage-entering');
        window.setTimeout(function () {
          document.documentElement.classList.remove('stage-entering');
        }, 1500);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="scroll-progress" id="scrollProgress"><span id="scrollProgressBar"></span></div>
  <div class="corner-marks" aria-hidden="true">
    <span class="corner-mark tl">+</span>
    <span class="corner-mark tr">+</span>
    <span class="corner-mark bl">+</span>
    <span class="corner-mark br">+</span>
  </div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>


    <aside class="sidebar">
    <a class="brand" href="index.html" aria-label="Architekt Schwartz — Startseite">
      <span class="brand-line">Architekt</span>
      <span class="brand-line brand-line-serif">Schwartz</span>
    </a>

    <div class="detail-panel" id="detailPanel"></div>

    <div class="sidebar-foot">
      <a class="sidebar-link" href="index.html#galerie">Galerie</a>
      <a class="sidebar-link" href="impressum/">Impressum</a>
      <span class="sidebar-copy" data-editable="source" data-path="/index.html" data-key="sidebar-copy-1" data-type="span">© 2024 — Wien, Österreich</span>
    </div>
  </aside>

  <main class="stage" id="stage">
  <section class="house-view" id="houseStage">
    <div class="parallax-bg" id="parallaxBg"></div>
    <div class="house-view-inner">
      <div class="shell-house house-mount" id="pageHouse"></div>
    </div>
  </section>

    <div class="stats-bar">
      <div class="stat-item reveal-clip">
        <div class="reveal-clip-inner">
          <span class="stat-num" data-target="87">0</span>
          <span class="stat-label" data-editable="source" data-path="/index.html" data-key="stat-label-2" data-type="span">Projekte realisiert</span>
        </div>
      </div>
      <div class="stat-item reveal-clip">
        <div class="reveal-clip-inner">
          <span class="stat-num" data-target="26">0</span>
          <span class="stat-label" data-editable="source" data-path="/index.html" data-key="stat-label-3" data-type="span">Jahre Erfahrung</span>
        </div>
      </div>
      <div class="stat-item reveal-clip">
        <div class="reveal-clip-inner">
          <span class="stat-num" data-target="14">0</span>
          <span class="stat-label" data-editable="source" data-path="/index.html" data-key="stat-label-4" data-type="span">Auszeichnungen</span>
        </div>
      </div>
      <div class="stat-item reveal-clip">
        <div class="reveal-clip-inner">
          <span class="stat-num" data-target="12">0</span>
          <span class="stat-label" data-editable="source" data-path="/index.html" data-key="stat-label-5" data-type="span">Teammitglieder</span>
        </div>
      </div>
    </div>

    <section class="gallery-header" id="galerie">
      <h1 class="gallery-title split-lines animate">Unsere<br><em>Projekte.</em></h1>
      <div class="gallery-filters animate">
        <button class="filter-btn active" onclick="filterGallery('all',this)">Alle</button>
        <button class="filter-btn" onclick="filterGallery('gebaut',this)">Gebaut</button>
        <button class="filter-btn" onclick="filterGallery('geplant',this)">Geplant</button>
      </div>
    </section>
    <div class="gallery-masonry" id="galleryMasonry"></div>

    <footer>
      <div class="footer-logo" data-editable="source" data-path="/index.html" data-key="footer-logo-7" data-type="text">Architekt Schwartz</div>
      <div class="footer-right">
        <a class="footer-impressum-link" href="impressum/">Impressum</a>
        <div class="footer-copy" data-editable="source" data-path="/index.html" data-key="footer-copy-8" data-type="text">© 2024 — Wien, Österreich</div>
      </div>
    </footer>
</main>

  <script src="js/buildings.js"></script>
  <script src="js/content-data.js"></script>
  <script src="js/house.js"></script>
  <script>window.PAGE_HOUSE = { mountId: 'pageHouse', variant: 'floors', items: HOME_FLOORS };</script>
  <script src="js/main.js"></script>
  <script src="js/transitions.js"></script>
</body>
</html>
