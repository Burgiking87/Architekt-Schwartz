<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Teammitglied von Architekt Schwartz — Rolle, Werdegang und Kontakt." />
  <title id="pageTitle">Team — Architekt Schwartz</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    /* Neue Ebene fährt von unten herein (siehe js/transitions.js).
       Sicherheitsnetz, falls das Skript nicht geladen wird. */
    (function () {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('stage-entering');
        window.setTimeout(function () {
          document.documentElement.classList.remove('stage-entering');
        }, 1500);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="scroll-progress" id="scrollProgress"><span id="scrollProgressBar"></span></div>
  <div class="corner-marks" aria-hidden="true">
    <span class="corner-mark tl">+</span>
    <span class="corner-mark tr">+</span>
    <span class="corner-mark bl">+</span>
    <span class="corner-mark br">+</span>
  </div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>


    <aside class="sidebar">
    <a class="brand" href="../index.html" aria-label="Architekt Schwartz — Startseite">
      <span class="brand-line">Architekt</span>
      <span class="brand-line brand-line-serif">Schwartz</span>
    </a>

    <div class="detail-panel" id="detailPanel"></div>

    <div class="sidebar-foot">
      <a class="sidebar-link" href="../index.html#galerie">Galerie</a>
      <a class="sidebar-link" href="../impressum/">Impressum</a>
      <span class="sidebar-copy" data-editable="source" data-path="/team/mitglied.html" data-key="sidebar-copy-1" data-type="span">© 2024 — Wien, Österreich</span>
    </div>
  </aside>

  <main class="stage" id="stage">
  <section class="house-view" id="houseStage">
    <a class="stage-back" href="index.html">← Zum Team</a>
    <div class="parallax-bg" id="parallaxBg"></div>
    <div class="house-view-inner">
      <div class="shell-house house-mount" id="pageHouse"></div>
    </div>
  </section>

    <footer>
      <div class="footer-logo" data-editable="source" data-path="/team/mitglied.html" data-key="footer-logo-2" data-type="text">Architekt Schwartz</div>
      <div class="footer-right">
        <a class="footer-impressum-link" href="../impressum/">Impressum</a>
        <div class="footer-copy" data-editable="source" data-path="/team/mitglied.html" data-key="footer-copy-3" data-type="text">© 2024 — Wien, Österreich</div>
      </div>
    </footer>
</main>

  <script src="../js/buildings.js"></script>
  <script src="../js/content-data.js"></script>
  <script src="../js/house.js"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const member = id ? teamMemberBySlug(id) : null;
      const items = teamFensterItems();

      if (!member) {
        // Unbekannter Slug: Haus normal zeigen, links ein Hinweis.
        window.PAGE_HOUSE = { mountId: 'pageHouse', variant: 'windows', items: items };
        window.PAGE_DETAIL = {
          eyebrow: 'Team',
          name: 'Nicht gefunden.',
          text: 'Dieses Teammitglied existiert nicht (mehr). Wähle rechts im Haus ein anderes Fenster.'
        };
        return;
      }

      const idx = TEAM_MEMBERS.indexOf(member);
      document.getElementById('pageTitle').textContent = member.name + ' — Architekt Schwartz';

      window.PAGE_HOUSE = {
        mountId: 'pageHouse',
        variant: 'windows',
        items: items,
        activeIndex: idx
      };
      window.PAGE_DETAIL = {
        eyebrow: member.role,
        name: member.name,
        text: member.bio,
        tags: member.tags,
        links: [
          { href: 'mailto:' + member.email, label: member.email },
          { href: 'tel:+4315123456', label: '+43 1 512 34 56' }
        ]
      };
    })();
  </script>

  <script src="../js/main.js"></script>
  <script src="../js/transitions.js"></script>
</body>
</html>
