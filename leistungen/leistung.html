<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Leistung von Architekt Schwartz im Detail." />
  <title id="pageTitle">Leistungen — Architekt Schwartz</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    /* Neue Ebene fährt von unten herein (siehe js/transitions.js).
       Sicherheitsnetz, falls das Skript nicht geladen wird. */
    (function () {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('stage-entering');
        window.setTimeout(function () {
          document.documentElement.classList.remove('stage-entering');
        }, 1500);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="scroll-progress" id="scrollProgress"><span id="scrollProgressBar"></span></div>
  <div class="corner-marks" aria-hidden="true">
    <span class="corner-mark tl">+</span>
    <span class="corner-mark tr">+</span>
    <span class="corner-mark bl">+</span>
    <span class="corner-mark br">+</span>
  </div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>


    <aside class="sidebar">
    <a class="brand" href="../index.html" aria-label="Architekt Schwartz — Startseite">
      <span class="brand-line">Architekt</span>
      <span class="brand-line brand-line-serif">Schwartz</span>
    </a>

    <div class="detail-panel" id="detailPanel"></div>

    <div class="sidebar-foot">
      <a class="sidebar-link" href="../index.html#galerie">Galerie</a>
      <a class="sidebar-link" href="../impressum/">Impressum</a>
      <span class="sidebar-copy" data-editable="source" data-path="/leistungen/leistung.html" data-key="sidebar-copy-1" data-type="span">© 2024 — Wien, Österreich</span>
    </div>
  </aside>

  <main class="stage" id="stage">
  <section class="house-view" id="houseStage">
    <a class="stage-back" href="index.html">← Zu Leistungen</a>
    <div class="parallax-bg" id="parallaxBg"></div>
    <div class="house-view-inner">
      <div class="shell-house house-mount" id="pageHouse"></div>
    </div>
  </section>

    <footer>
      <div class="footer-logo" data-editable="source" data-path="/leistungen/leistung.html" data-key="footer-logo-2" data-type="text">Architekt Schwartz</div>
      <div class="footer-right">
        <a class="footer-impressum-link" href="../impressum/">Impressum</a>
        <div class="footer-copy" data-editable="source" data-path="/leistungen/leistung.html" data-key="footer-copy-3" data-type="text">© 2024 — Wien, Österreich</div>
      </div>
    </footer>
</main>

  <script src="../js/buildings.js"></script>
  <script src="../js/content-data.js"></script>
  <script src="../js/house.js"></script>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const leistung = id ? leistungById(id) : null;
      const items = LEISTUNGEN.map(function (l) {
        return { slug: l.slug, label: l.fensterLabel || l.label, href: 'leistung.html?id=' + l.slug, ariaLabel: 'Leistung ' + l.label + ' ansehen' };
      });

      if (!leistung) {
        window.PAGE_HOUSE = { mountId: 'pageHouse', variant: 'scattered', items: items };
        window.PAGE_DETAIL = {
          eyebrow: 'Leistungen',
          name: 'Nicht gefunden.',
          text: 'Diese Leistung existiert nicht (mehr). Wähle rechts im Haus ein anderes Fenster.'
        };
        return;
      }

      let idx = -1;
      for (let i = 0; i < LEISTUNGEN.length; i++) {
        if (LEISTUNGEN[i].slug === leistung.slug) idx = i;
      }
      document.getElementById('pageTitle').textContent = leistung.label + ' — Architekt Schwartz';

      window.PAGE_HOUSE = { mountId: 'pageHouse', variant: 'scattered', items: items, activeIndex: idx };
      window.PAGE_DETAIL = {
        eyebrow: leistung.kurztext,
        name: leistung.label,
        text: leistung.text,
        links: [{ href: '../kontakt/', label: 'Projekt anfragen →' }]
      };
    })();
  </script>

  <script src="../js/main.js"></script>
  <script src="../js/transitions.js"></script>
</body>
</html>
